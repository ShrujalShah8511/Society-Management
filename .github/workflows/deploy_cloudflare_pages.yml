name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality
        run: |
          flutter analyze
          flutter test

      - name: Build Web Application
        run: |
          DART_DEFINES=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}"; fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"; fi
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}"; fi
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}"; fi
          if [ -n "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"; fi
          if [ -n "${{ secrets.FIREBASE_APP_ID }}" ]; then DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}"; fi
          flutter build web --release $DART_DEFINES

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=society-management
